name: Bug report
description: Report a reproducible vscode-mcp defect
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities here. Use the private process in SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Unsupported environment
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: vscode-mcp, VS Code, Node.js, and MCP client versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps without source code, tokens, or private paths
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed source content, credentials, tokens, and private local paths.
          required: true
