name: Feature request
description: Propose a bounded product improvement
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent or user workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and scope impact
      description:
        Note any new data exposure, mutation, execution, platform, or dependency.
    validations:
      required: true
