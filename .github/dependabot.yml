version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    ignore:
      # @types/node must track the Node major in engines.node (^22.13.0).
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      development-tooling:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      # init and analyze must run the same CodeQL version, so they have to be
      # bumped in a single pull request.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
