name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0
  PNPM_VERSION: 10.24.0

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependency advisories
        run: pnpm run audit

      - name: Run static checks and unit tests
        run: pnpm check

      - name: Build packages
        run: pnpm build

  extension-host:
    name: VS Code ${{ matrix.vscode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        vscode:
          - 1.101.0
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test extension host on Linux
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a pnpm test:extension

      - name: Test extension host on macOS
        if: runner.os == 'macOS'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: pnpm test:extension

  packaged-pair:
    name: Packaged pair on VS Code ${{ matrix.vscode }} / ${{ matrix.os }}
    needs:
      - validate
      - extension-host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        vscode:
          - 1.101.0
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact release pair
        run: pnpm package:release

      - name: Test installed pair on Linux
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a pnpm test:artifacts

      - name: Test installed pair on macOS
        if: runner.os == 'macOS'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: pnpm test:artifacts

  package-release-candidate:
    name: Package local release candidate
    needs:
      - validate
      - extension-host
      - packaged-pair
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Package first release candidate
        run: |
          pnpm package:release
          cp artifacts/release-1.0.0/SHA256SUMS /tmp/vscode-mcp-first-SHA256SUMS

      - name: Rebuild and verify reproducibility
        run: |
          pnpm package:release
          cmp /tmp/vscode-mcp-first-SHA256SUMS artifacts/release-1.0.0/SHA256SUMS

      - name: Upload packaged candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-mcp-local-release-candidate
          path: artifacts/release-1.0.0/
          if-no-files-found: error
          retention-days: 7
