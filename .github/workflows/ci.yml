name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0
  COREPACK_VERSION: 0.35.0
  PNPM_VERSION: 10.24.0
  RELEASE_VERSION: 1.0.1

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          npm install --global corepack@${COREPACK_VERSION}
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependency advisories
        run: pnpm run audit

      - name: Run static checks and unit tests
        run: pnpm check

      - name: Build packages
        run: pnpm build

  extension-host:
    name: VS Code ${{ matrix.vscode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
        vscode:
          - 1.101.0
          - stable
        exclude:
          - os: macos-15-intel
            vscode: 1.101.0

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          npm install --global corepack@${COREPACK_VERSION}
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test extension host on Linux
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: |
          xvfb-run -a pnpm test:extension && exit 0
          echo '::warning::VS Code lifecycle test failed once; retrying the complete suite with a clean runtime.'
          xvfb-run -a pnpm test:extension

      - name: Test extension host on macOS
        if: runner.os == 'macOS'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: |
          pnpm test:extension && exit 0
          echo '::warning::VS Code lifecycle test failed once; retrying the complete suite with a clean runtime.'
          pnpm test:extension

  packaged-pair:
    name: Packaged pair on VS Code ${{ matrix.vscode }} / ${{ matrix.os }}
    needs:
      - validate
      - extension-host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
        vscode:
          - 1.101.0
          - stable
        exclude:
          - os: macos-15-intel
            vscode: 1.101.0

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          npm install --global corepack@${COREPACK_VERSION}
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact release pair
        run: pnpm package:release

      - name: Test installed pair on Linux
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: |
          xvfb-run -a pnpm test:artifacts && exit 0
          echo '::warning::Packaged-pair test failed once; retrying the complete suite with fresh artifacts and runtime.'
          xvfb-run -a pnpm test:artifacts

      - name: Test installed pair on macOS
        if: runner.os == 'macOS'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: |
          pnpm test:artifacts && exit 0
          echo '::warning::Packaged-pair test failed once; retrying the complete suite with fresh artifacts and runtime.'
          pnpm test:artifacts

  package-release-candidate:
    name: Package local release candidate
    needs:
      - validate
      - extension-host
      - packaged-pair
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          npm install --global corepack@${COREPACK_VERSION}
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Package first release candidate
        run: |
          pnpm package:release
          cp "artifacts/release-${RELEASE_VERSION}/SHA256SUMS" /tmp/vscode-mcp-first-SHA256SUMS

      - name: Rebuild and verify reproducibility
        run: |
          pnpm package:release
          cmp /tmp/vscode-mcp-first-SHA256SUMS "artifacts/release-${RELEASE_VERSION}/SHA256SUMS"

      - name: Upload packaged candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-mcp-local-release-candidate
          path: artifacts/release-1.0.1/
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - validate
      - extension-host
      - packaged-pair
      - package-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI stage
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          EXTENSION_HOST_RESULT: ${{ needs.extension-host.result }}
          PACKAGED_PAIR_RESULT: ${{ needs.packaged-pair.result }}
          RELEASE_CANDIDATE_RESULT: ${{ needs.package-release-candidate.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$EXTENSION_HOST_RESULT" = success
          test "$PACKAGED_PAIR_RESULT" = success
          test "$RELEASE_CANDIDATE_RESULT" = success
